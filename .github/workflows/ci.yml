name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The unit tests drive the real OS layer (files, child processes), so they
    # run natively on every platform mibi ships for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig build
      # The browser build, driven through the page's own host code with an
      # in-memory folder standing in for the File System Access API.
      - run: zig build web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/test/web.test.mjs
      # The real thing in a pseudo-terminal: raw mode, the run loop, resize,
      # save, and the terminal handed back. (Windows has no pty to script.)
      - if: runner.os != 'Windows'
        run: python3 tools/smoke.py zig-out/bin/mibi

  size:
    # Cross-compiles all five targets and holds each one to its byte budget.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ZIG=zig tools/check-size.sh
