name: release

# Pushing a tag like v0.1.0 tests it, builds the archives for every target
# and attaches them to a GitHub release. The tag must match the version the
# binary reports, so a release can never carry the wrong number. The web
# build is deployed by deploy-web.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig build web
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test web/test/web.test.mjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: The tag is the version in the source
        run: |
          version=$(sed -n 's/^pub const version = "\(.*\)";$/\1/p' src/app.zig)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in src/app.zig" >&2
            exit 1
          fi
      - run: ZIG=zig tools/check-size.sh
      - run: ZIG=zig tools/package.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "mibi ${GITHUB_REF_NAME#v}" \
            --notes "See [the changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/CHANGELOG.md)." \
            --verify-tag

