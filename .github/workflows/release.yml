name: release

# Pushing a tag like v0.1.0 tests it, builds the archives for every target,
# attaches them to a GitHub release, and publishes the web build to GitHub
# Pages. The tag must match the version the binary reports, so a release can
# never carry the wrong number. Running the workflow by hand publishes only
# the web build, from whatever ref it is run on.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig build web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/test/web.test.mjs

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: The tag is the version in the source
        run: |
          version=$(sed -n 's/^pub const version = "\(.*\)";$/\1/p' src/app.zig)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in src/app.zig" >&2
            exit 1
          fi
      - run: ZIG=zig tools/check-size.sh
      - run: ZIG=zig tools/package.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "mibi ${GITHUB_REF_NAME#v}" \
            --notes "See [the changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/CHANGELOG.md)." \
            --verify-tag

  pages:
    # The page is static: mibi.wasm, the host scripts, xterm.js, the font and
    # the data files, as `zig build web` installs them.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/web
      - id: deploy
        uses: actions/deploy-pages@v4
