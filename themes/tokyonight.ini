; Tokyonight colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #1a1b26
text = #a9b1d6
gutter = #565f89
selection = #283457
bar_bg = #16161e
accent = #7aa2f7
hint_bg = #16161e
hint_fg = #565f89
tab_bg = #16161e
tab_active_bg = #283457
help_bg = #13131a
comment = #565f89
keyword1 = #bb9af7
keyword2 = #7aa2f7
string = #9ece6a
number = #ff9e64
