; Nightfox colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #192330
text = #cdcecf
gutter = #738091
selection = #2b3b51
bar_bg = #131a24
accent = #719cd6
hint_bg = #131a24
hint_fg = #738091
tab_bg = #131a24
tab_active_bg = #2b3b51
help_bg = #0f151d
comment = #738091
keyword1 = #c94f6d
keyword2 = #dbc074
string = #81b29a
number = #f2a65a
