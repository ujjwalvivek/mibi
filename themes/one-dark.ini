; One Dark colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #282c34
text = #abb2bf
gutter = #5c6370
selection = #3e4451
bar_bg = #21252b
accent = #61afef
hint_bg = #21252b
hint_fg = #5c6370
tab_bg = #21252b
tab_active_bg = #3e4451
help_bg = #1b1f24
comment = #5c6370
keyword1 = #c678dd
keyword2 = #e5c07b
string = #98c379
number = #d19a66
