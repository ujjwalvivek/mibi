; Github Dark colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #0d1117
text = #c9d1d9
gutter = #8b949e
selection = #264f78
bar_bg = #161b22
accent = #58a6ff
hint_bg = #161b22
hint_fg = #8b949e
tab_bg = #161b22
tab_active_bg = #21262d
help_bg = #010409
comment = #8b949e
keyword1 = #ff7b72
keyword2 = #ffa657
string = #a5d6ff
number = #79c0ff
