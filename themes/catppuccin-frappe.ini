; Catppuccin Frappe colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #303446
text = #c6d0f5
gutter = #737994
selection = #51576d
bar_bg = #292c3c
accent = #ca9ee6
hint_bg = #292c3c
hint_fg = #838ba7
tab_bg = #292c3c
tab_active_bg = #414559
help_bg = #232634
comment = #838ba7
keyword1 = #ca9ee6
keyword2 = #e5c890
string = #a6d189
number = #ef9f76
