; Everforest colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #2d353b
text = #d3c6aa
gutter = #859289
selection = #475258
bar_bg = #232a2e
accent = #a7c080
hint_bg = #232a2e
hint_fg = #859289
tab_bg = #232a2e
tab_active_bg = #475258
help_bg = #1e2429
comment = #859289
keyword1 = #e67e80
keyword2 = #dbbc7f
string = #a7c080
number = #d699b6
