; Vs Dark colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #1e1e1e
text = #d4d4d4
gutter = #858585
selection = #264f78
bar_bg = #252526
accent = #4ec9b0
hint_bg = #252526
hint_fg = #858585
tab_bg = #2d2d2d
tab_active_bg = #1e1e1e
help_bg = #1e1e1e
comment = #6a9955
keyword1 = #569cd6
keyword2 = #4ec9b0
string = #ce9178
number = #b5cea8
