; Catppuccin Latte colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #eff1f5
text = #4c4f69
gutter = #9ca0b0
selection = #bcc0cc
bar_bg = #e6e9ef
accent = #8839ef
hint_bg = #e6e9ef
hint_fg = #8c8fa1
tab_bg = #e6e9ef
tab_active_bg = #ccd0da
help_bg = #dce0e8
comment = #8c8fa1
keyword1 = #8839ef
keyword2 = #df8e1d
string = #40a02b
number = #fe640b
