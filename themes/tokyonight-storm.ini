; Tokyonight Storm colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #24283b
text = #c0caf5
gutter = #565f89
selection = #364a82
bar_bg = #1f2335
accent = #7aa2f7
hint_bg = #1f2335
hint_fg = #565f89
tab_bg = #1f2335
tab_active_bg = #364a82
help_bg = #1b1e2d
comment = #565f89
keyword1 = #bb9af7
keyword2 = #7aa2f7
string = #9ece6a
number = #ff9e64
