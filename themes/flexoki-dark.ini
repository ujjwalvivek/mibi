; Flexoki Dark colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #100f0f
text = #cecdc3
gutter = #878580
selection = #282726
bar_bg = #1c1b1a
accent = #d0a215
hint_bg = #1c1b1a
hint_fg = #878580
tab_bg = #1c1b1a
tab_active_bg = #282726
help_bg = #0c0b0b
comment = #878580
keyword1 = #d14d41
keyword2 = #4385be
string = #879a39
number = #d0a215
