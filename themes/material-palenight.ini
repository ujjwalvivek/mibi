; Material Palenight colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #292d3e
text = #a6accd
gutter = #676e95
selection = #444267
bar_bg = #1e2132
accent = #82aaff
hint_bg = #1e2132
hint_fg = #676e95
tab_bg = #1e2132
tab_active_bg = #444267
help_bg = #1b1e2b
comment = #676e95
keyword1 = #c792ea
keyword2 = #ffcb6b
string = #c3e88d
number = #f78c6c
