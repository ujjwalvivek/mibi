; Catppuccin Mocha colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #1e1e2e
text = #cdd6f4
gutter = #6c7086
selection = #45475a
bar_bg = #181825
accent = #cba6f7
hint_bg = #181825
hint_fg = #7f849c
tab_bg = #181825
tab_active_bg = #313244
help_bg = #11111b
comment = #7f849c
keyword1 = #cba6f7
keyword2 = #f9e2af
string = #a6e3a1
number = #fab387
