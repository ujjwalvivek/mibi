; Kanagawa colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #1f1f28
text = #dcd7ba
gutter = #727169
selection = #2d4f67
bar_bg = #16161d
accent = #7e9cd8
hint_bg = #16161d
hint_fg = #727169
tab_bg = #16161d
tab_active_bg = #2d4f67
help_bg = #13131a
comment = #727169
keyword1 = #957fb8
keyword2 = #7e9cd8
string = #98bb6c
number = #d27e99
