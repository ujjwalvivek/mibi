; Oxocarbon colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #161616
text = #f2f4f8
gutter = #525252
selection = #262626
bar_bg = #0f0f0f
accent = #78a9ff
hint_bg = #0f0f0f
hint_fg = #525252
tab_bg = #0f0f0f
tab_active_bg = #262626
help_bg = #0a0a0a
comment = #525252
keyword1 = #be95ff
keyword2 = #08bdba
string = #42be65
number = #ee5396
