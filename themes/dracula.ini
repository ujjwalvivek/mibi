; Dracula colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #282a36
text = #f8f8f2
gutter = #6272a4
selection = #44475a
bar_bg = #21222c
accent = #50fa7b
hint_bg = #21222c
hint_fg = #6272a4
tab_bg = #21222c
tab_active_bg = #44475a
help_bg = #191a21
comment = #6272a4
keyword1 = #ff79c6
keyword2 = #8be9fd
string = #f1fa8c
number = #bd93f9
