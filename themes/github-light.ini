; Github Light colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #ffffff
text = #24292f
gutter = #6e7781
selection = #b6d7ff
bar_bg = #f6f8fa
accent = #0969da
hint_bg = #f6f8fa
hint_fg = #6e7781
tab_bg = #f6f8fa
tab_active_bg = #eaeef2
help_bg = #f6f8fa
comment = #6e7781
keyword1 = #cf222e
keyword2 = #953800
string = #0a3069
number = #0550ae
