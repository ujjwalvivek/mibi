; Vs Light colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #ffffff
text = #000000
gutter = #237893
selection = #add6ff
bar_bg = #f3f3f3
accent = #007acc
hint_bg = #f3f3f3
hint_fg = #6e6e6e
tab_bg = #ececec
tab_active_bg = #ffffff
help_bg = #f3f3f3
comment = #008000
keyword1 = #0000ff
keyword2 = #267f99
string = #a31515
number = #098658
