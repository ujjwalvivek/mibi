; Catppuccin Macchiato colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #24273a
text = #cad3f5
gutter = #6e738d
selection = #494d64
bar_bg = #1e2030
accent = #c6a0f6
hint_bg = #1e2030
hint_fg = #8087a2
tab_bg = #1e2030
tab_active_bg = #363a4f
help_bg = #181926
comment = #8087a2
keyword1 = #c6a0f6
keyword2 = #eed49f
string = #a6da95
number = #f5a97f
