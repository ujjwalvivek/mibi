; Rose Pine Moon colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #232136
text = #e0def4
gutter = #6e6a86
selection = #393552
bar_bg = #2a273f
accent = #c4a7e7
hint_bg = #2a273f
hint_fg = #908caa
tab_bg = #2a273f
tab_active_bg = #393552
help_bg = #1f1d30
comment = #6e6a86
keyword1 = #c4a7e7
keyword2 = #9ccfd8
string = #ea9a97
number = #f6c177
