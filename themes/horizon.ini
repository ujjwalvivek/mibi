; Horizon colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #1c1e26
text = #d5d8da
gutter = #6c6f93
selection = #2e303e
bar_bg = #16161c
accent = #e95678
hint_bg = #16161c
hint_fg = #6c6f93
tab_bg = #16161c
tab_active_bg = #2e303e
help_bg = #14151b
comment = #6c6f93
keyword1 = #e95678
keyword2 = #26bbd9
string = #fab795
number = #fac29a
