; Gruvbox Dark colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #282828
text = #ebdbb2
gutter = #928374
selection = #504945
bar_bg = #3c3836
accent = #b8bb26
hint_bg = #3c3836
hint_fg = #928374
tab_bg = #3c3836
tab_active_bg = #504945
help_bg = #1d2021
comment = #928374
keyword1 = #fb4934
keyword2 = #fabd2f
string = #b8bb26
number = #d3869b
