; Solarized Dark colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #002b36
text = #839496
gutter = #586e75
selection = #073642
bar_bg = #073642
accent = #2aa198
hint_bg = #073642
hint_fg = #586e75
tab_bg = #073642
tab_active_bg = #0a4b5a
help_bg = #00252e
comment = #586e75
keyword1 = #859900
keyword2 = #b58900
string = #2aa198
number = #d33682
