; Ayu Dark colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #0b0e14
text = #bfbdb6
gutter = #565b66
selection = #1c2530
bar_bg = #0d1017
accent = #e6b450
hint_bg = #0d1017
hint_fg = #565b66
tab_bg = #0d1017
tab_active_bg = #1c2530
help_bg = #090c11
comment = #565b66
keyword1 = #ff8f40
keyword2 = #59c2ff
string = #aad94c
number = #d2a6ff
