; Monokai colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #272822
text = #f8f8f2
gutter = #75715e
selection = #49483e
bar_bg = #1e1f1c
accent = #a6e22e
hint_bg = #1e1f1c
hint_fg = #75715e
tab_bg = #1e1f1c
tab_active_bg = #49483e
help_bg = #1b1c18
comment = #75715e
keyword1 = #f92672
keyword2 = #66d9ef
string = #e6db74
number = #ae81ff
