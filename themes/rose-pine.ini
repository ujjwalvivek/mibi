; Rose Pine colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #191724
text = #e0def4
gutter = #6e6a86
selection = #26233a
bar_bg = #1f1d2e
accent = #c4a7e7
hint_bg = #1f1d2e
hint_fg = #908caa
tab_bg = #1f1d2e
tab_active_bg = #26233a
help_bg = #16141f
comment = #6e6a86
keyword1 = #c4a7e7
keyword2 = #9ccfd8
string = #ebbcba
number = #f6c177
