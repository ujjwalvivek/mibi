; Nord colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #2e3440
text = #d8dee9
gutter = #616e88
selection = #434c5e
bar_bg = #3b4252
accent = #88c0d0
hint_bg = #3b4252
hint_fg = #616e88
tab_bg = #3b4252
tab_active_bg = #434c5e
help_bg = #272c36
comment = #616e88
keyword1 = #81a1c1
keyword2 = #8fbcbb
string = #a3be8c
number = #b48ead
