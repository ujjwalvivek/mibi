; Rose Pine Dawn colour theme for mibi.
;
; Colours are #rrggbb. Keys match the [theme] section of mibi.ini;
; anything left out falls back to the built-in default.

[theme]
background = #faf4ed
text = #575279
gutter = #9893a5
selection = #f2e9e1
bar_bg = #fffaf3
accent = #907aa9
hint_bg = #fffaf3
hint_fg = #9893a5
tab_bg = #fffaf3
tab_active_bg = #f2e9e1
help_bg = #f4ede8
comment = #9893a5
keyword1 = #907aa9
keyword2 = #56949f
string = #d7827e
number = #ea9d34
